! DEMO DATA - not exported from the real Packet Tracer build
hostname DC-R1
!
enable secret 9 $9$demo
service password-encryption
ip ssh version 2
ip domain-name bank.local
!
crypto isakmp policy 10
 encryption aes 256
 authentication pre-share
 group 5
!
crypto ipsec transform-set TS esp-aes 256 esp-sha-hmac
!
crypto map WAN-MAP 10 ipsec-isakmp
 set peer 203.0.113.2
 set transform-set TS
 match address VPN-TRAFFIC
!
interface GigabitEthernet0/0
 ip address 10.0.0.1 255.255.255.0
 ip access-group ATM-IN in
!
interface Serial0/0/0
 ip address 203.0.113.1 255.255.255.252
 crypto map WAN-MAP
!
router ospf 1
 network 10.0.0.0 0.0.0.255 area 0
!
ip access-list extended ATM-IN
 permit tcp 10.20.0.0 0.0.255.255 host 10.0.0.10 eq 8443
 deny ip any any log
!
banner motd #Authorised access only#
ntp server 10.0.0.250
!
line vty 0 4
 transport input ssh
 login local
!
end
